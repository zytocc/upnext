# Versions for the Android app. Every library here is Apache-2.0
# (docs/THIRD_PARTY.md) and none comes from Google Play services, so
# F-Droid can build the app from source.
[versions]
androidGradlePlugin = "9.3.2"
kotlin = "2.4.21"
kotlinxSerialization = "1.11.0"
androidxActivity = "1.9.3"
androidxCore = "1.15.0"
zxingAndroidEmbedded = "4.3.0"
junit = "4.13.2"

[libraries]
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
androidx-activity = { group = "androidx.activity", name = "activity", version.ref = "androidxActivity" }
androidx-core = { group = "androidx.core", name = "core", version.ref = "androidxCore" }
zxing-android-embedded = { group = "com.journeyapps", name = "zxing-android-embedded", version.ref = "zxingAndroidEmbedded" }
junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
