# title/body based on your changelogs.
#
# Edited by hand since it was generated (dist-workspace.toml's allow-dirty
# keeps dist from overwriting it; re-apply these after regenerating):
# - every action pinned to a commit SHA, its version in a comment;
# - no permissions by default: `contents: write` only for the plan job (its
#   `dist host --steps=create` on a tag), the host job, which publishes the
