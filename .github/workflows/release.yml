#   job's wait for it;
# - the build-apk job, which builds and signs the
#   Android app from android/ once its release key is set up, and the host
#   job's wait for it;
# - the build-flatpak job, which builds the Flatpak
#   bundle from the tag with contrib/flatpak/build.sh once the repository
#   variable UPNEXT_FLATPAK_BUNDLE turns it on, and the host job's wait for
#   it;
# - the build-steam-depots job, which lays out the Steam
#   copy's Linux and Windows depots from dist's x86_64 Linux archive and
#   Windows zip with contrib/steam/build-depots.sh once the repository
#   variable UPNEXT_STEAM_DEPOTS turns it on (the host job doesn't wait for
#   it: the depots aren't release files), and the publish-steam job, which
#   uploads them to a beta branch on Steam with contrib/steam/upload.sh once
#   UPNEXT_STEAM_UPLOAD and the builder account's secrets are set up;
# - the attach-steam-sources job, which attaches the Ubuntu
#   source packages of the libraries in the Linux depot, gathered by
#   build-steam-depots with contrib/steam/fetch-sources.py, to the release
#   once it is published, and publish-steam's wait for it;
# - the check-notices job, which fails the release when the
#   committed third-party notices that every artefact carries don't match
#   what contrib/notices/generate.mjs makes from the tag's lock files, and
#   the host job's wait for it;
# - pull requests: the workflow starts only for
#   a change to what dist plans from (the paths under `pull_request`), and
#   then the plan-pr job runs `dist plan` with a read-only token, while the
#   plan job, which holds the write token, runs only for a tag.

name: Release
permissions: {}

# This task will run whenever you push a git tag that looks like a version
# like "1.0.0", "v0.1.0-prerelease.1", "my-app/0.1.0", "releases/v1.0.0", etc.
# Various formats will be parsed into a VERSION and an optional PACKAGE_NAME, where
# PACKAGE_NAME must be the name of a Cargo package in your workspace, and VERSION
# must be a Cargo-style SemVer Version (must have at least major.minor.patch).
#
# If PACKAGE_NAME is specified, then the announcement will be for that
# package (erroring out if it doesn't have the given version or isn't dist-able).
#
# If PACKAGE_NAME isn't specified, then the announcement will be for all
# (dist-able) packages in the workspace with that version (this mode is
# intended for workspaces with only one dist-able package, or with all dist-able
# packages versioned/released in lockstep).
#
# If you push multiple tags at once, separate instances of this workflow will
# spin up, creating an independent announcement for each one. However, GitHub
# will hard limit this to 3 tags per commit, as it will assume more tags is a
# mistake.
#
# If there's a prerelease-style suffix to the version, then the release(s)
# will be marked as a prerelease.
on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'dist-workspace.toml'
      - '.github/build-setup.yml'
      - '.github/workflows/release.yml'
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'

jobs:
  # A pull request's check that dist can still plan the release, on the pull
  # request's own checkout with a read-only token. Nothing else runs for a
  # pull request: every other job waits on plan, which doesn't run for one.
  plan-pr:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: "ubuntu-22.04"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install dist
        # dist 0.33.0's installer, checked before it runs; it checks the binary
        # it downloads against the checksums inside it. A new cargo-dist-version
        # needs this hash too: sha256sum of the new cargo-dist-installer.sh.
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf -o "$RUNNER_TEMP/dist-installer.sh" https://github.com/axodotdev/cargo-dist/releases/download/v0.33.0/cargo-dist-installer.sh
          echo "c5b53ac2559eb26e3b3dc28755eb5d011ed6ec9ac97fa4fc2a2459872e766b5e  $RUNNER_TEMP/dist-installer.sh" | sha256sum -c -
          sh "$RUNNER_TEMP/dist-installer.sh"
      - name: Plan
        run: dist plan --output-format=json

  # Run 'dist plan' (or host) to determine what tasks we need to do
  plan:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: "ubuntu-22.04"
    permissions:
      contents: write
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      tag: ${{ !github.event.pull_request && github.ref_name || '' }}
      tag-flag: ${{ !github.event.pull_request && format('--tag={0}', github.ref_name) || '' }}
      publishing: ${{ !github.event.pull_request }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install dist
        # dist 0.33.0's installer, checked before it runs; it checks the binary
        # it downloads against the checksums inside it. A new cargo-dist-version
        # needs this hash too: sha256sum of the new cargo-dist-installer.sh.
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf -o "$RUNNER_TEMP/dist-installer.sh" https://github.com/axodotdev/cargo-dist/releases/download/v0.33.0/cargo-dist-installer.sh
          echo "c5b53ac2559eb26e3b3dc28755eb5d011ed6ec9ac97fa4fc2a2459872e766b5e  $RUNNER_TEMP/dist-installer.sh" | sha256sum -c -
          sh "$RUNNER_TEMP/dist-installer.sh"
      - name: Cache dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/dist
      # sure would be cool if github gave us proper conditionals...
      # so here's a doubly-nested ternary-via-truthiness to try to provide the best possible
      # functionality based on whether this is a pull_request, and whether it's from a fork.
      # (PRs run on the *source* but secrets are usually on the *target* -- that's *good*
      # but also really annoying to build CI around when it needs secrets to work right.)
      - id: plan
        run: |
          dist ${{ (!github.event.pull_request && format('host --steps=create --tag={0}', github.ref_name)) || 'plan' }} --output-format=json > plan-dist-manifest.json
          echo "dist ran successfully"
          cat plan-dist-manifest.json
          echo "manifest=$(jq -c "." plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json

  # Build and packages all the platform-specific things
  build-local-artifacts:
    name: build-local-artifacts (${{ join(matrix.targets, ', ') }})
    # Let the initial task tell us to not run (currently very blunt)
    needs:
      - plan
    if: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix.include != null && (needs.plan.outputs.publishing == 'true' || fromJson(needs.plan.outputs.val).ci.github.pr_run_mode == 'upload') }}
    strategy:
      fail-fast: false
      # Target platforms/runners are computed by dist in create-release.
      # Each member of the matrix has the following arguments:
      #
      # - runner: the github runner
      # - dist-args: cli flags to pass to dist
      # - install-dist: expression to run to install dist on the runner
      #
      # Typically there will be:
      # - 1 "global" task that builds universal installers
      # - N "local" tasks that build each platform's binaries and platform-specific installers
      matrix: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container && matrix.container.image || null }}
    permissions:
      contents: read
    env:
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
    steps:
      - name: enable windows longpaths
        run: |
          git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Rust non-interactively if not already installed
        if: ${{ matrix.container }}
        run: |
          if ! command -v cargo > /dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          fi
      - name: "Set up Node"
        uses: "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1" # v7.1.0
        with:
          "cache": "npm"
          "cache-dependency-path": "web/package-lock.json"
          "node-version": 24
      - name: "Build the web UI"
        run: |
          cd web
          npm ci --no-audit --no-fund
          npm run build
      - name: Install dist
        if: runner.os == 'Linux'
        # dist 0.33.0's installer, checked before it runs; it checks the binary
        # it downloads against the checksums inside it. A new cargo-dist-version
        # needs this hash too: sha256sum of the new cargo-dist-installer.sh.
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf -o "$RUNNER_TEMP/dist-installer.sh" https://github.com/axodotdev/cargo-dist/releases/download/v0.33.0/cargo-dist-installer.sh
          echo "c5b53ac2559eb26e3b3dc28755eb5d011ed6ec9ac97fa4fc2a2459872e766b5e  $RUNNER_TEMP/dist-installer.sh" | sha256sum -c -
          sh "$RUNNER_TEMP/dist-installer.sh"
      - name: Install dist (Windows)
        if: runner.os == 'Windows'
        # dist 0.33.0's Windows build, checked before it's unpacked. A new
        # cargo-dist-version needs this hash too: the SHA-256 of the new
        # cargo-dist-x86_64-pc-windows-msvc.zip.
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'cargo-dist.zip'
          Invoke-WebRequest -UseBasicParsing -OutFile $zip -Uri https://github.com/axodotdev/cargo-dist/releases/download/v0.33.0/cargo-dist-x86_64-pc-windows-msvc.zip
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash -ne '9a36d70795e14326a5ec4bf17aee085df00ab85a322739291ea5d4b1b5f693cd') {
            throw "cargo-dist-x86_64-pc-windows-msvc.zip doesn't match its SHA-256"
          }
          $bin = Join-Path $env:RUNNER_TEMP 'cargo-dist'
          Expand-Archive -LiteralPath $zip -DestinationPath $bin
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $bin
      - name: Install dist (other systems)
        if: runner.os != 'Linux' && runner.os != 'Windows'
        run: ${{ matrix.install_dist.run }}
      # Get the dist-manifest
      - name: Fetch local artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - name: Install dependencies
        run: |
          ${{ matrix.packages_install }}
      - name: Build artifacts
        run: |
          # Actually do builds and make zips and whatnot
          dist build ${{ needs.plan.outputs.tag-flag }} --print=linkage --output-format=json ${{ matrix.dist_args }} > dist-manifest.json
          echo "dist ran successfully"
      - id: cargo-dist
        name: Post-build
        # We force bash here just because github makes it really hard to get values up
        # to "real" actions without writing to env-vars, and writing to env-vars has
        # inconsistent syntax between shell and powershell.
        shell: bash
        run: |
          # Parse out what we just built and upload it to scratch storage
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          dist print-upload-files-from-manifest --manifest dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  # Build and package all the platform-agnostic(ish) things
  build-global-artifacts:
    needs:
      - plan
      - build-local-artifacts
    runs-on: "ubuntu-22.04"
    permissions:
      contents: read
    env:
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Get all the local artifacts for the global tasks to use (for e.g. checksums)
      - name: Fetch local artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: cargo-dist
        shell: bash
        run: |
          dist build ${{ needs.plan.outputs.tag-flag }} --output-format=json "--artifacts=global" > dist-manifest.json
          echo "dist ran successfully"

          # Parse out what we just built and upload it to scratch storage
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          jq --raw-output ".upload_files[]" dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-build-global
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}
  # The Windows installer, from the programs in dist's Windows zip, on a tag
  # only (added by hand). dist's own MSI is per-machine,
  # so contrib/windows/build-msi.ps1 builds UpNext's per-user one, the same
  # script development builds use. When SignPath signs releases, the
  # programs go through it between the unzip and the MSI, and the MSI
  # after it.
  build-msi:
    needs:
      - plan
      - build-local-artifacts
    if: ${{ needs.plan.outputs.publishing == 'true' }}
    runs-on: "windows-latest"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch the Windows build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: artifacts-build-local-x86_64-pc-windows-msvc
          path: target/distrib/
      - name: Build the MSI
        # The script downloads WiX 3.14.1 and checks its SHA-256 itself.
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath target/distrib/upnext-x86_64-pc-windows-msvc.zip -DestinationPath target/msi-bin
          $exe = Get-ChildItem -LiteralPath target/msi-bin -Recurse -Filter upnext.exe | Select-Object -First 1
          ./contrib/windows/build-msi.ps1 -BinDir $exe.DirectoryName -OutDir target/msi
      - name: "Upload the MSI"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-build-msi
          path: |
            target/msi/upnext-x86_64-pc-windows-msvc.msi
            target/msi/upnext-x86_64-pc-windows-msvc.msi.sha256
          if-no-files-found: error

  # The Debian and Fedora packages, from the programs in dist's two Linux
  # archives, on a tag only (added by hand). nfpm repacks
  # them, so nothing compiles twice, with contrib/linux/build-packages.sh,
  # the script development builds use too. The amd64 packages are installed
  # in Debian 12, Ubuntu 24.04 and Fedora 44 containers before anything is
  # published (contrib/linux/smoke-test.sh); arm64's are built the same way
  # from programs built on arm64, and aren't run here.
  build-linux-packages:
    needs:
      - plan
      - build-local-artifacts
    if: ${{ needs.plan.outputs.publishing == 'true' }}
    runs-on: "ubuntu-24.04"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch the Linux builds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-build-local-*-unknown-linux-gnu
          path: target/distrib/
          merge-multiple: true
      - name: Build the packages
        # The script downloads nfpm and checks its SHA-256 itself.
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          version="${TAG#v}"
          echo "UPNEXT_PACKAGE_VERSION=$version" >> "$GITHUB_ENV"
          for pair in x86_64:amd64 aarch64:arm64; do
            triple="${pair%%:*}-unknown-linux-gnu"
            tar -xJf "target/distrib/upnext-$triple.tar.xz" -C target/distrib
            contrib/linux/build-packages.sh --arch "${pair##*:}" --version "$version" \
              --bin-dir "target/distrib/upnext-$triple" --out-dir target/linux-packages
          done
          ls -l target/linux-packages
      - name: Smoke-test the amd64 packages
        run: |
          v="$UPNEXT_PACKAGE_VERSION"
          contrib/linux/smoke-test.sh "target/linux-packages/upnext_$v-1_amd64.deb" debian:12 "$v"
          contrib/linux/smoke-test.sh "target/linux-packages/upnext_$v-1_amd64.deb" ubuntu:24.04 "$v"
          contrib/linux/smoke-test.sh "target/linux-packages/upnext-$v-1.x86_64.rpm" fedora:44 "$v"
      - name: "Upload the packages"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-build-linux-packages
          path: target/linux-packages/
          if-no-files-found: error

  # The Arch Linux package and the PKGBUILD it was built from, on a tag only
  # (added by hand). contrib/arch/build-package.sh renders
  # the release's PKGBUILD with the checksums of dist's two Linux archives,
  # then builds the package from the x86_64 archive in an archlinux:base-devel
  # container: makepkg finds the archive under its source name and checks it
  # instead of downloading it, so the package comes from the very PKGBUILD
  # the release publishes, before the release exists. namcap checks both, and
  # an error stops the release. The package is then installed in a fresh
  # archlinux:latest container (contrib/linux/smoke-test.sh). Both images are
  # pinned by digest, like the actions; docs/dev/RELEASE.md ("The Arch
  # images") says how to move them on. No secrets: the next job signs it.
  build-arch-package:
    needs:
      - plan
      - build-local-artifacts
    if: ${{ needs.plan.outputs.publishing == 'true' }}
    runs-on: "ubuntu-24.04"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch the Linux builds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-build-local-*-unknown-linux-gnu
          path: target/distrib/
          merge-multiple: true
      - name: Build the package
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          contrib/arch/build-package.sh --tag "$TAG" --dist-dir target/distrib --out-dir target/arch-package
          ls -l target/arch-package
      - name: Smoke-test the package
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          # The same image, pinned to the same digest, as contrib/arch/sign-repo.sh.
          ARCH_IMAGE: archlinux:latest@sha256:4e77cf2ea5f410e6f8be5abf93ccf17ce2436e87a138c167208356711a405dbd
        run: |
          contrib/linux/smoke-test.sh target/arch-package/upnext-bin-*-x86_64.pkg.tar.zst "$ARCH_IMAGE" "${TAG#v}"
      - name: "Upload the package"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-build-arch-package
          path: |
            target/arch-package/PKGBUILD
            target/arch-package/upnext-bin-*.pkg.tar.zst
            target/arch-package/upnext-bin-*.pkg.tar.zst.sha256
          if-no-files-found: error

  # The signed pacman repository, on a tag only (added by hand):
  # contrib/arch/sign-repo.sh signs the Arch package with the
  # project's signing subkey and builds upnext.db and upnext.files, listing
  # that one package, with repo-add, signing them too. pacman reaches them
  # through releases/latest/download, so every release has to carry them
  # once users have the [upnext] stanza. The repository variable
  # PACMAN_KEY_FINGERPRINT turns the repository on: without it the job only
  # leaves a notice saying the repository wasn't published, and with it and
  # no PACMAN_SIGNING_KEY secret it fails, and the release with it, rather
  # than publish a release whose missing database would break
  # `pacman -Syu` for everyone using the repository (a maintainer's decision). The script signs in an archlinux:latest container with
  # Arch's own gpg and repo-add, refuses a key that isn't the variable's or
  # the committed contrib/arch/upnext-signing-key.asc, and refuses the
  # primary key's secret half, which stays offline. The secrets reach that
  # one step alone; nothing from npm or cargo runs in this job.
  # docs/dev/RELEASE.md, "The Arch package repository", has the setup.
  sign-pacman-repo:
    needs:
      - plan
      - build-arch-package
    if: ${{ needs.plan.outputs.publishing == 'true' }}
    runs-on: "ubuntu-24.04"
    permissions:
      contents: read
    steps:
      - name: Check for the signing key
        id: key
        env:
          HAS_FINGERPRINT: ${{ vars.PACMAN_KEY_FINGERPRINT != '' }}
          HAS_KEY: ${{ secrets.PACMAN_SIGNING_KEY != '' }}
        run: |
          if [ "$HAS_FINGERPRINT" != true ]; then
            if [ "$HAS_KEY" = true ]; then
              echo "::notice::The PACMAN_SIGNING_KEY secret is set but the PACMAN_KEY_FINGERPRINT variable isn't, so the pacman repository wasn't published. Set the variable to publish it (docs/dev/RELEASE.md, \"The Arch package repository\")."
            else
              echo "::notice::No PACMAN_KEY_FINGERPRINT variable, so the pacman repository wasn't published; the release has the Arch package alone."
            fi
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          elif [ "$HAS_KEY" != true ]; then
            echo "::error::PACMAN_KEY_FINGERPRINT is set but the PACMAN_SIGNING_KEY secret isn't, so the pacman repository can't be signed. Set the secret (docs/dev/RELEASE.md, \"The Arch package repository\"), or delete the variable to release without the repository."
            exit 1
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.key.outputs.enabled == 'true'
        with:
          persist-credentials: false
      - name: Fetch the Arch package
        if: steps.key.outputs.enabled == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: artifacts-build-arch-package
          path: target/arch-package/
      - name: Sign the package and build the repository
        if: steps.key.outputs.enabled == 'true'
        env:
          PACMAN_KEY_FINGERPRINT: ${{ vars.PACMAN_KEY_FINGERPRINT }}
          PACMAN_SIGNING_KEY: ${{ secrets.PACMAN_SIGNING_KEY }}
          PACMAN_SIGNING_KEY_PASSPHRASE: ${{ secrets.PACMAN_SIGNING_KEY_PASSPHRASE }}
        run: |
          shopt -s nullglob
          packages=(target/arch-package/upnext-bin-*-x86_64.pkg.tar.zst)
          [ ${#packages[@]} = 1 ] || { echo "::error::expected one Arch package, found ${#packages[@]}"; exit 1; }
          contrib/arch/sign-repo.sh --package "${packages[0]}" --fingerprint "$PACMAN_KEY_FINGERPRINT" --out-dir target/pacman-repo
      - name: "Upload the repository"
        if: steps.key.outputs.enabled == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-pacman-repo
          path: target/pacman-repo/
          if-no-files-found: error

  # The Android app, built from android/ and signed with the release key,
  # on a tag only (added by hand). It runs only when the
  # UPNEXT_ANDROID_KEYSTORE secret is set; without it the release goes out
  # without the APK, and says so. The key never comes from a pull request:
  # tags only, and the secrets reach the one build step. F-Droid builds the
  # same tag and checks its build against this APK (contrib/fdroid/).
  # docs/dev/RELEASE.md, "The Android app", has the setup.
  build-apk:
    needs:
      - plan
    if: ${{ needs.plan.outputs.publishing == 'true' }}
    runs-on: "ubuntu-24.04"
    permissions:
      contents: read
    steps:
      - name: Check for the signing key
        id: key
        env:
          HAS_KEY: ${{ secrets.UPNEXT_ANDROID_KEYSTORE != '' }}
        run: |
          if [ "$HAS_KEY" != true ]; then
            echo "::notice::No UPNEXT_ANDROID_KEYSTORE secret, so the release has no Android app (docs/dev/RELEASE.md, \"The Android app\")."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.key.outputs.enabled == 'true'
        with:
          persist-credentials: false
      - name: Check the Gradle wrapper
        if: steps.key.outputs.enabled == 'true'
        working-directory: android
        run: |
          version=$(sed -n 's|^distributionUrl=.*/gradle-\(.*\)-bin\.zip$|\1|p' gradle/wrapper/gradle-wrapper.properties)
          expected=$(curl -fsSL "https://services.gradle.org/distributions/gradle-$version-wrapper.jar.sha256")
          echo "$expected  gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -
      - name: Build and sign the APK
        if: steps.key.outputs.enabled == 'true'
        working-directory: android
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          KEYSTORE_BASE64: ${{ secrets.UPNEXT_ANDROID_KEYSTORE }}
          UPNEXT_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.UPNEXT_ANDROID_KEYSTORE_PASSWORD }}
          UPNEXT_ANDROID_KEY_ALIAS: ${{ secrets.UPNEXT_ANDROID_KEY_ALIAS }}
          UPNEXT_ANDROID_KEY_PASSWORD: ${{ secrets.UPNEXT_ANDROID_KEY_PASSWORD }}
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export UPNEXT_ANDROID_KEYSTORE="$RUNNER_TEMP/release.jks"
          ./gradlew --no-daemon :core:test :app:checkVersion :app:assembleRelease
          rm -f "$RUNNER_TEMP/release.jks"
          version="${TAG#v}"
          apk="upnext-android-$version.apk"
          mkdir -p ../target/apk
          cp app/build/outputs/apk/release/app-release.apk "../target/apk/$apk"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)/apksigner" verify --print-certs "../target/apk/$apk"
          (cd ../target/apk && sha256sum -b "$apk" > "$apk.sha256")
      - name: "Upload the APK"
        if: steps.key.outputs.enabled == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-build-apk
          path: target/apk/
          if-no-files-found: error

  # The Flatpak as a single-file bundle, built from the tag's source on a tag
  # only (added by hand), in Flathub's image for building
  # GNOME apps, pinned by digest, with contrib/flatpak/build.sh, then
  # installed and run in its sandbox (contrib/flatpak/smoke-test.sh). It runs
  # only when the repository variable UPNEXT_FLATPAK_BUNDLE is `on`; without
  # it the job is skipped, and the host job notes that the release has no
  # bundle. The bundle is how the Flatpak is offered (UpNext isn't on
  # Flathub). No secrets.
  # docs/dev/RELEASE.md, "The Flatpak", has the details.
  build-flatpak:
    needs:
      - plan
    # The variable gates the whole job, so a release without the bundle
    # never starts the privileged container; the host job says so.
    if: ${{ needs.plan.outputs.publishing == 'true' && vars.UPNEXT_FLATPAK_BUNDLE == 'on' }}
    runs-on: "ubuntu-24.04"
    permissions:
      contents: read
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51@sha256:78d969b18225ae107ca29497bf09c4a3f791e5f1838a9a912a529d0024fb6210
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Build the bundle
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: contrib/flatpak/build.sh --out target/flatpak --version "${TAG#v}"
      - name: Run it in its sandbox
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: contrib/flatpak/smoke-test.sh "target/flatpak/upnext-${TAG#v}-x86_64.flatpak"
      - name: "Upload the bundle"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-build-flatpak
          path: |
            target/flatpak/upnext-*.flatpak
            target/flatpak/upnext-*.flatpak.sha256
          if-no-files-found: error

  # The Steam copy's two depots, laid out from the release's own programs on
  # a tag only (added by hand), when the repository
  # variable UPNEXT_STEAM_DEPOTS is `on`; without it the release goes out as
  # before and says so. contrib/steam/build-depots.sh checks dist's x86_64
  # Linux archive and Windows zip against their .sha256 files and makes the
  # Linux depot with WebKitGTK and the other libraries the programs need,
  # copied from this runner's Ubuntu 22.04, the system dist built them on;
  # contrib/steam/smoke-test.sh then runs it in an Ubuntu 22.04 container
  # with no GTK or WebKitGTK. The depots go up as this run's steam-depots
  # artifact, as a tar so the Linux files keep their executable bits, and not
  # into the release, whose programs they are. contrib/steam/fetch-sources.py
  # then gathers the Ubuntu source packages of exactly the libraries and
  # versions the Linux depot carries (its share/licenses/PACKAGES.txt), as
  # the LGPL and GPL ask, into the steam-sources artifact, which
  # attach-steam-sources puts on the release. No secrets:
  # publish-steam uploads the depots to Steam. docs/dev/RELEASE.md, "The
  # Steam copy", has the rest.
  build-steam-depots:
    needs:
      - plan
      - build-local-artifacts
    if: ${{ needs.plan.outputs.publishing == 'true' }}
    runs-on: "ubuntu-22.04"
    permissions:
      contents: read
    steps:
      - name: Check whether the depots are wanted
        id: on
        env:
          WANTED: ${{ vars.UPNEXT_STEAM_DEPOTS == 'on' }}
        run: |
          if [ "$WANTED" != true ]; then
            echo "::notice::The UPNEXT_STEAM_DEPOTS variable isn't on, so no Steam depots were made (docs/dev/RELEASE.md, \"The Steam copy\")."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.on.outputs.enabled == 'true'
        with:
          persist-credentials: false
      - name: Fetch the Linux build
        if: steps.on.outputs.enabled == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: artifacts-build-local-x86_64-unknown-linux-gnu
          path: target/distrib/
      - name: Fetch the Windows build
        if: steps.on.outputs.enabled == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: artifacts-build-local-x86_64-pc-windows-msvc
          path: target/distrib/
      - name: Install what the Linux depot carries
        if: steps.on.outputs.enabled == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libwebkit2gtk-4.1-0 libgtk-3-0 librsvg2-common \
            glib-networking dconf-gsettings-backend libglib2.0-bin patchelf binutils xvfb imagemagick
      - name: Lay out the depots
        if: steps.on.outputs.enabled == 'true'
        run: contrib/steam/build-depots.sh --from target/distrib --out target/steam
      - name: Run the Linux depot without GTK or WebKitGTK
        if: steps.on.outputs.enabled == 'true'
        run: contrib/steam/smoke-test.sh target/steam/linux ubuntu:22.04
      - name: Pack the depots
        if: steps.on.outputs.enabled == 'true'
        run: tar -C target/steam -cf target/steam-depots.tar linux windows
      - name: "Upload the depots"
        if: steps.on.outputs.enabled == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: steam-depots
          path: target/steam-depots.tar
          if-no-files-found: error
      - name: Gather the Linux depot's library sources
        if: steps.on.outputs.enabled == 'true'
        run: contrib/steam/fetch-sources.py --depot target/steam/linux --out target/steam-sources/upnext-steam-linux-sources.tar
      - name: "Upload the library sources"
        if: steps.on.outputs.enabled == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: steam-sources
          path: |
            target/steam-sources/upnext-steam-linux-sources.tar
            target/steam-sources/upnext-steam-linux-sources.tar.sha256
          if-no-files-found: error

  # The third-party notices every artefact carries (THIRD_PARTY_NOTICES.txt,
  # and the Android app's), regenerated from the tag's lock files and
  # compared with what's committed, as the notices workflow does on main
  # (added by hand). The artefacts carry the committed files,
  # so a release whose notices fell behind stops at the host job. No secrets.
  check-notices:
    needs:
      - plan
    if: ${{ needs.plan.outputs.publishing == 'true' }}
    runs-on: "ubuntu-24.04"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      # Checked against the SHA-256 in install-action's own manifest; the
      # same version as .github/workflows/notices.yml.
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-about@0.9.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Check the notices
        run: |
          cargo fetch --locked
          (cd web && npm ci --no-audit --no-fund)
          node contrib/notices/generate.mjs --check

  # Determines if we should publish/announce
  host:
    needs:
      - plan
      - build-local-artifacts
      - build-global-artifacts
      - build-msi
      - build-linux-packages
      - build-arch-package
      - sign-pacman-repo
      - build-apk
      - build-flatpak
      - check-notices
    # Only run if we're "publishing", and only if plan, local, global, the MSI, the Linux packages, the Arch package, the pacman repository, the APK and the Flatpak didn't fail (skipped is fine), and the notices are current
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.publishing == 'true' && needs.check-notices.result == 'success' && (needs.build-global-artifacts.result == 'skipped' || needs.build-global-artifacts.result == 'success') && (needs.build-local-artifacts.result == 'skipped' || needs.build-local-artifacts.result == 'success') && (needs.build-msi.result == 'skipped' || needs.build-msi.result == 'success') && (needs.build-linux-packages.result == 'skipped' || needs.build-linux-packages.result == 'success') && (needs.build-arch-package.result == 'skipped' || needs.build-arch-package.result == 'success') && (needs.sign-pacman-repo.result == 'skipped' || needs.sign-pacman-repo.result == 'success') && (needs.build-apk.result == 'skipped' || needs.build-apk.result == 'success') && (needs.build-flatpak.result == 'skipped' || needs.build-flatpak.result == 'success') }}
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    runs-on: "ubuntu-22.04"
    outputs:
      val: ${{ steps.host.outputs.manifest }}
    steps:
      # build-flatpak is skipped while its variable is off; say so here.
      - name: Note a release without the Flatpak bundle
        if: ${{ vars.UPNEXT_FLATPAK_BUNDLE != 'on' }}
        run: echo "::notice::The UPNEXT_FLATPAK_BUNDLE variable isn't on, so the release has no Flatpak bundle (docs/dev/RELEASE.md, \"The Flatpak\")."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Fetch artifacts from scratch-storage
      - name: Fetch artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: host
        shell: bash
        run: |
          dist host ${{ needs.plan.outputs.tag-flag }} --steps=upload --steps=release --output-format=json > dist-manifest.json
          echo "artifacts uploaded and released successfully"
          cat dist-manifest.json
          echo "manifest=$(jq -c "." dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Overwrite the previous copy
          name: artifacts-dist-manifest
          path: dist-manifest.json
      # Create a GitHub Release while uploading all files to it
      - name: "Download GitHub Artifacts"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true
      - name: Cleanup
        run: |
          # Remove the granular manifests
          rm -f artifacts/*-dist-manifest.json
      - name: Create GitHub Release
        env:
          PRERELEASE_FLAG: "${{ fromJson(steps.host.outputs.manifest).announcement_is_prerelease && '--prerelease' || '' }}"
          ANNOUNCEMENT_TITLE: "${{ fromJson(steps.host.outputs.manifest).announcement_title }}"
          ANNOUNCEMENT_BODY: "${{ fromJson(steps.host.outputs.manifest).announcement_github_body }}"
          RELEASE_COMMIT: "${{ github.sha }}"
        run: |
          # Write and read notes from a file to avoid quoting breaking things
          echo "$ANNOUNCEMENT_BODY" > $RUNNER_TEMP/notes.txt
          # SignPath Foundation's terms want the code signing policy on the
          # release page too (added by hand).
          printf '\n**Code signing policy:** see the [README](%s/%s#code-signing-policy).\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" >> $RUNNER_TEMP/notes.txt

          gh release create "${{ needs.plan.outputs.tag }}" --target "$RELEASE_COMMIT" $PRERELEASE_FLAG --title "$ANNOUNCEMENT_TITLE" --notes-file "$RUNNER_TEMP/notes.txt" artifacts/*

  # Pushes the Linux packages to the apt and dnf repositories on Cloudsmith
  # once the release is published (added by hand). It
  # runs only when the repository variable CLOUDSMITH_REPOSITORY names the
  # Cloudsmith repository (owner/name), and never for a prerelease, so an
  # -rc tag doesn't reach apt or dnf users; without the CLOUDSMITH_API_KEY
  # secret it says so and stops there, and the release stands. Plain curl
  # against Cloudsmith's API: no CLI or action to install, and the key goes
  # to Cloudsmith alone. docs/dev/RELEASE.md has the setup.
  publish-cloudsmith:
    needs:
      - plan
      - host
    if: ${{ always() && needs.host.result == 'success' && vars.CLOUDSMITH_REPOSITORY != '' && !fromJson(needs.plan.outputs.val).announcement_is_prerelease }}
    runs-on: "ubuntu-24.04"
    permissions: {}
    env:
      CLOUDSMITH_REPOSITORY: ${{ vars.CLOUDSMITH_REPOSITORY }}
      CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
    steps:
      - name: Check for the API key
        id: key
        run: |
          if [ -z "$CLOUDSMITH_API_KEY" ]; then
            echo "::notice::No CLOUDSMITH_API_KEY secret, so the packages weren't pushed to Cloudsmith."
            echo "present=false" >> "$GITHUB_OUTPUT"
          elif ! [[ $CLOUDSMITH_REPOSITORY =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::CLOUDSMITH_REPOSITORY must be owner/name, not $CLOUDSMITH_REPOSITORY"
            exit 1
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Fetch the packages
        if: steps.key.outputs.present == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: artifacts-build-linux-packages
          path: packages/
      - name: Push to Cloudsmith
        if: steps.key.outputs.present == 'true'
        # Each file goes up in two requests: the file itself, which answers
        # with an identifier, then the package made from it, offered to every
        # Debian and Ubuntu release (or every rpm distribution) through
        # any-distro/any-version. Cloudsmith then indexes and signs it.
        run: |
          set -euo pipefail
          api() { curl --proto '=https' --tlsv1.2 -sS --fail-with-body --retry 3 -H "X-Api-Key: $CLOUDSMITH_API_KEY" "$@"; }
          for f in packages/*.deb packages/*.rpm; do
            name=$(basename "$f")
            format=${name##*.}
            sha=$(sha256sum "$f" | cut -d' ' -f1)
            id=$(api -X PUT -H "Content-Sha256: $sha" --upload-file "$f" \
              "https://upload.cloudsmith.io/$CLOUDSMITH_REPOSITORY/$name" | jq -r '.identifier // empty')
            [ -n "$id" ] || { echo "::error::Cloudsmith gave no identifier for $name"; exit 1; }
            jq -n --arg id "$id" '{package_file: $id, distribution: "any-distro/any-version"}' |
              api -X POST -H "Content-Type: application/json" --data-binary @- \
                "https://api.cloudsmith.io/v1/packages/$CLOUDSMITH_REPOSITORY/upload/$format/" |
              jq -r --arg name "$name" '"\($name): \(.self_html_url // .slug_perm // "pushed")"'
          done

  # Attaches the source of the libraries in the Steam copy's Linux depot to
  # the release once it is published (added by hand), whenever
  # the repository variable UPNEXT_STEAM_DEPOTS is `on` and the depots were
  # made, so every release with a Steam build carries the Ubuntu source
  # packages of exactly the versions its depot ships, as the LGPL and GPL
  # ask; the depot's share/licenses/PACKAGES.txt names the file. The host
  # job doesn't wait for the depots, so this comes after it, and
  # publish-steam waits for this. Only gh runs here, with the write token;
  # the files were made in build-steam-depots, which has none.
  attach-steam-sources:
    needs:
      - plan
      - build-steam-depots
      - host
    if: ${{ always() && needs.host.result == 'success' && needs.build-steam-depots.result == 'success' && vars.UPNEXT_STEAM_DEPOTS == 'on' }}
    runs-on: "ubuntu-22.04"
    permissions:
      contents: write
    steps:
      - name: Fetch the library sources
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: steam-sources
          path: steam-sources/
      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.plan.outputs.tag }}
        # A re-run replaces the file, as it does the depots on Steam.
        run: |
          set -euo pipefail
          (cd steam-sources && sha256sum -c upnext-steam-linux-sources.tar.sha256)
          gh release upload "$TAG" --clobber --repo "$GITHUB_REPOSITORY" \
            steam-sources/upnext-steam-linux-sources.tar steam-sources/upnext-steam-linux-sources.tar.sha256

  # Uploads the Steam copy's depots to Steam once the release is published
  # (added by hand), as one build set live on a beta
  # branch, never the default one: the maintainer checks it there and sets it live
  # in Steamworks. It runs only when the repository variables
  # UPNEXT_STEAM_DEPOTS and UPNEXT_STEAM_UPLOAD are `on`; without the builder
  # account's secrets (STEAM_USERNAME, and STEAM_CONFIG_VDF, its saved
  # steamcmd sign-in) or the ids and steamcmd's checksum in variables it says
  # so and stops, and the release stands. steamcmd's bootstrap is checked
  # against STEAMCMD_SHA256 before it runs; steamcmd then updates itself, as
  # it always does. It waits for attach-steam-sources, so no build reaches
  # Steam before its libraries' source is on the release. docs/dev/RELEASE.md,
  # "The Steam copy", has the setup.
  publish-steam:
    needs:
      - plan
      - build-steam-depots
      - host
      - attach-steam-sources
    if: ${{ always() && needs.host.result == 'success' && needs.build-steam-depots.result == 'success' && needs.attach-steam-sources.result == 'success' && vars.UPNEXT_STEAM_DEPOTS == 'on' && vars.UPNEXT_STEAM_UPLOAD == 'on' }}
    runs-on: "ubuntu-22.04"
    permissions:
      contents: read
    env:
      STEAM_APP_ID: ${{ vars.STEAM_APP_ID }}
      STEAM_DEPOT_LINUX: ${{ vars.STEAM_DEPOT_LINUX }}
      STEAM_DEPOT_WINDOWS: ${{ vars.STEAM_DEPOT_WINDOWS }}
      STEAM_BRANCH: ${{ vars.STEAM_BRANCH || 'beta' }}
      STEAMCMD_SHA256: ${{ vars.STEAMCMD_SHA256 }}
    steps:
      - name: Check for the builder account
        id: key
        env:
          HAS_USER: ${{ secrets.STEAM_USERNAME != '' }}
          HAS_CONFIG: ${{ secrets.STEAM_CONFIG_VDF != '' }}
        run: |
          missing=
          [ "$HAS_USER" = true ] || missing="$missing STEAM_USERNAME"
          [ "$HAS_CONFIG" = true ] || missing="$missing STEAM_CONFIG_VDF"
          for v in STEAM_APP_ID STEAM_DEPOT_LINUX STEAM_DEPOT_WINDOWS STEAMCMD_SHA256; do
            [ -n "$(printenv "$v")" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::notice::Missing$missing, so nothing was uploaded to Steam (docs/dev/RELEASE.md, \"The Steam copy\")."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.key.outputs.present == 'true'
        with:
          persist-credentials: false
      - name: Fetch the depots
        if: steps.key.outputs.present == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: steam-depots
          path: target/
      - name: Install steamcmd
        if: steps.key.outputs.present == 'true'
        # steamcmd is a 32-bit program. Its bootstrap is checked here; it
        # updates itself from Valve when it first runs.
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends lib32gcc-s1
          mkdir -p "$RUNNER_TEMP/steamcmd" target/steam
          curl --proto '=https' --tlsv1.2 -fsSL -o "$RUNNER_TEMP/steamcmd_linux.tar.gz" https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz
          echo "$STEAMCMD_SHA256  $RUNNER_TEMP/steamcmd_linux.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/steamcmd_linux.tar.gz" -C "$RUNNER_TEMP/steamcmd"
          tar -xf target/steam-depots.tar -C target/steam
      - name: Upload to Steam
        if: steps.key.outputs.present == 'true'
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_CONFIG_VDF: ${{ secrets.STEAM_CONFIG_VDF }}
        # The saved sign-in goes where steamcmd looks for it, in its own
        # folder and in ~/Steam, and is removed afterwards with the runner.
        run: |
          set -euo pipefail
          for dir in "$RUNNER_TEMP/steamcmd/config" "$HOME/Steam/config"; do
            mkdir -p "$dir"
            printf '%s' "$STEAM_CONFIG_VDF" | base64 -d > "$dir/config.vdf"
          done
          STEAMCMD="$RUNNER_TEMP/steamcmd/steamcmd.sh" contrib/steam/upload.sh \
            --depots target/steam --branch "$STEAM_BRANCH" --desc "UpNext $TAG"
          rm -f "$RUNNER_TEMP/steamcmd/config/config.vdf" "$HOME/Steam/config/config.vdf"

  announce:
    needs:
      - plan
      - host
    # use "always() && ..." to allow us to wait for all publish jobs while
    # still allowing individual publish jobs to skip themselves (for prereleases).
    # "host" however must run to completion, no skipping allowed!
    if: ${{ always() && needs.host.result == 'success' }}
    runs-on: "ubuntu-22.04"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
