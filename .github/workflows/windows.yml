name: windows

# Builds and tests on Windows. A workflow of its own, apart from
# ci.yml, so its queue and cancelling never touch the Linux jobs.
#
# Where it runs: GitHub's `windows-latest` unless the repository
# variable UPNEXT_RUNNER_WINDOWS names a self-hosted runner's label
# (`upnext-windows`, optional while the repository is private;
# docs/dev/CI-RUNNERS.md). A new repository has no variables, so it runs on
# GitHub's runner with no edit here. Never set the variable on a public
# repository (ci.yml says why); on a self-hosted runner the job is skipped
# for a pull request from a fork, as a second guard.
#
# GitHub's Windows runners take twice the Linux minutes from a private
# repository's allowance, and are slower everywhere, so it runs only when
# Rust code, the fixtures, the files under contrib/ that the code builds in
# or this file change (tests/workflow_paths.rs checks that list).
# workflow_dispatch runs it by hand.
#
# Windows test builds come from `cargo build --release --bins` on a Windows
# machine, to save Actions minutes, and the release MSI
# from cargo-dist on tags (release.yml). Run by hand, it also builds the
# Microsoft Store package (the msix job), to test between releases.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'contrib/windows/**'
      - 'contrib/linux/**'
      - 'contrib/steam/**'
      - 'Cargo.toml'
      - 'build.rs'
      - 'Cargo.lock'
      - '.gitattributes'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'contrib/windows/**'
      - 'contrib/linux/**'
      - 'contrib/steam/**'
      - 'Cargo.toml'
      - 'build.rs'
      - 'Cargo.lock'
      - '.gitattributes'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

# On main a run finishes before the next starts (one more waits, newer
# pushes replace it): several threads push to main, and a run cancelled
# partway never saves its build cache, so the next starts cold again. A
# pull request's newer push cancels its older run.
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The job reads the code and nothing else; the build cache needs no token
# scope of its own.
permissions:
  contents: read

jobs:
  rust:
    runs-on: ${{ vars.UPNEXT_RUNNER_WINDOWS || 'windows-latest' }}
    if: vars.UPNEXT_RUNNER_WINDOWS == '' || github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      # Line numbers but no full debug information in the test builds, which
      # are compiled and linked faster. Only the dev profile: a release keeps
      # its own settings (Cargo.toml).
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      # persist-credentials: false keeps the job's token out of .git/config,
      # where every later step could read it (and, on a self-hosted runner,
      # the next job until the checkout is cleaned). No step pushes to git.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The MSVC toolchain links WebView2's loader statically, so the
      # desktop feature needs nothing installed. On a self-hosted runner
      # this installs rustup for the runner's account the first time, then
      # only a new stable; the Build Tools, NASM, Git Bash and PowerShell 7
      # come from docs/dev/CI-RUNNERS.md.
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: clippy

      # actions/checkout cleans the checkout before each run, so on a
      # self-hosted runner the build goes to a folder beside it that outlives
      # the run, in place of rust-cache. Cargo never deletes old builds: past
      # 30 GB it starts over.
      - name: Build folder (self-hosted)
        if: runner.environment == 'self-hosted'
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_WORKSPACE 'cargo-target'
          if ((Test-Path $dir) -and ((Get-ChildItem $dir -Recurse -File | Measure-Object Length -Sum).Sum -gt 30GB)) {
            Remove-Item $dir -Recurse -Force
          }
          "CARGO_TARGET_DIR=$dir" >> $env:GITHUB_ENV

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: runner.environment == 'github-hosted'

      # The tests make hundreds of databases in temporary folders. On
      # GitHub's runner TEMP is on the system disk (C:), which is far slower
      # than the runner's own D: disk that holds the checkout and
      # RUNNER_TEMP, and Microsoft Defender scans every file the build and
      # the tests write. GitHub's runner runs this job alone and is thrown
      # away after it, so its real-time scan goes off here; never on a
      # self-hosted runner, which is someone's own machine.
      - name: Temporary files on the fast disk, no real-time scan (GitHub's runner)
        if: runner.environment == 'github-hosted'
        shell: pwsh
        run: |
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          try {
            Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction Stop
            "Defender's real-time scan on: $((Get-MpComputerStatus).RealTimeProtectionEnabled)"
          } catch {
            "Defender's real-time scan left as it is: $_"
          }

      - run: cargo clippy --all-targets --locked -- -D warnings
      # Debug test builds read web/dist from disk and serve a placeholder
      # without it, so the UI isn't built here.
      - run: cargo test --locked

      # The two programs, which `cargo test` has built for the integration
      # tests (a separate `cargo build` would compile UpNext again, against
      # dependencies without the tests' features): `upnext.exe` is built for
      # the console, `upnext-app.exe` for the desktop, so the Start menu
      # opens it without a terminal. The PE header's Subsystem field says
      # which: 3 is the console, 2 the desktop (Windows GUI).
      - name: Check each program's subsystem
        shell: pwsh
        run: |
          function Get-Subsystem($path) {
            $bytes = [IO.File]::ReadAllBytes($path)
            $pe = [BitConverter]::ToInt32($bytes, 0x3C)
            [BitConverter]::ToUInt16($bytes, $pe + 24 + 68)
          }
          $debug = Join-Path ($env:CARGO_TARGET_DIR ?? 'target') 'debug'
          $cli = Get-Subsystem (Join-Path $debug upnext.exe)
          $app = Get-Subsystem (Join-Path $debug upnext-app.exe)
          "upnext.exe: $cli, upnext-app.exe: $app"
          if ($cli -ne 3 -or $app -ne 2) { throw "expected 3 (console) and 2 (desktop)" }
          & (Join-Path $debug upnext.exe) --version

  # The Microsoft Store package from this commit, only when the workflow is
  # run by hand (Actions, windows, Run workflow): a release build of both
  # programs with the web UI, packed by contrib/windows/build-msix.ps1 with
  # the identity Partner Center gave the app, from the repository variables
  # UPNEXT_MSIX_IDENTITY_NAME, UPNEXT_MSIX_PUBLISHER,
  # UPNEXT_MSIX_PUBLISHER_DISPLAY_NAME and UPNEXT_MSIX_DISPLAY_NAME, or with
  # the script's placeholders while they aren't set. The artifact carries
  # the package and its unpacked folder, which a Windows machine in
  # Developer Mode registers to test it (contrib/windows/README.md).
  msix:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ vars.UPNEXT_RUNNER_WINDOWS || 'windows-latest' }}
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      # A cache of its own: a release build shares nothing with the tests'.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: runner.environment == 'github-hosted'
        with:
          key: msix
      # A release build embeds the web UI from web/dist.
      - name: Build the web UI
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - run: cargo build --release --locked --bins
      - name: Build the package
        shell: pwsh
        env:
          IDENTITY_NAME: ${{ vars.UPNEXT_MSIX_IDENTITY_NAME }}
          PUBLISHER: ${{ vars.UPNEXT_MSIX_PUBLISHER }}
          PUBLISHER_DISPLAY_NAME: ${{ vars.UPNEXT_MSIX_PUBLISHER_DISPLAY_NAME }}
          DISPLAY_NAME: ${{ vars.UPNEXT_MSIX_DISPLAY_NAME }}
        run: |
          $identity = @{}
          if ($env:IDENTITY_NAME) { $identity.IdentityName = $env:IDENTITY_NAME }
          if ($env:PUBLISHER) { $identity.Publisher = $env:PUBLISHER }
          if ($env:PUBLISHER_DISPLAY_NAME) { $identity.PublisherDisplayName = $env:PUBLISHER_DISPLAY_NAME }
          if ($env:DISPLAY_NAME) { $identity.DisplayName = $env:DISPLAY_NAME }
          ./contrib/windows/build-msix.ps1 -BinDir target/release -OutDir target/msix @identity
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upnext-msix-${{ github.sha }}
          path: target/msix/
          retention-days: 14
          if-no-files-found: error
