name: notices

# THIRD_PARTY_NOTICES.txt and the Android app's notices
# (android/app/src/main/assets/third_party_notices.txt) are generated by
# contrib/notices/generate.mjs and committed, since the Flatpak builds with no
# network to make them. This regenerates both and fails when they differ from
# what's committed, so they can't fall behind the lock files: after a
# dependency changes, run `node contrib/notices/generate.mjs` and commit the
# result (docs/dev/RELEASE.md, "Third-party notices"). A Dependabot update
# fails here until that's done.
#
# Its own workflow, rather than a job in `ci`, because `ci` skips changes
# under android/, and libs.versions.toml's versions are in the notices too.
on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Dockerfile'
      - 'LICENSE-APACHE'
      - 'THIRD_PARTY_NOTICES.txt'
      - 'contrib/notices/**'
      - 'web/package.json'
      - 'web/package-lock.json'
      - 'web/src/lib/credits.ts'
      - 'android/gradle/libs.versions.toml'
      - 'android/app/src/main/assets/third_party_notices.txt'
      - '.github/workflows/notices.yml'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Dockerfile'
      - 'LICENSE-APACHE'
      - 'THIRD_PARTY_NOTICES.txt'
      - 'contrib/notices/**'
      - 'web/package.json'
      - 'web/package-lock.json'
      - 'web/src/lib/credits.ts'
      - 'android/gradle/libs.versions.toml'
      - 'android/app/src/main/assets/third_party_notices.txt'
      - '.github/workflows/notices.yml'
  workflow_dispatch:

concurrency:
  group: notices-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Where it runs: as `ci` (GitHub's runner unless UPNEXT_RUNNER_LINUX names a
# self-hosted one, which then skips pull requests from forks).
jobs:
  notices:
    runs-on: ${{ vars.UPNEXT_RUNNER_LINUX || 'ubuntu-latest' }}
    if: vars.UPNEXT_RUNNER_LINUX == '' || github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable

      # cargo-about's release build, which install-action checks against the
      # SHA-256 in its own manifest (pinned with the action's commit). The
      # version is part of the output's input: a new one may word a standard
      # licence text differently, so change it here and regenerate together.
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-about@0.9.2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
          cache-dependency-path: web/package-lock.json

      # The crates' and the npm packages' own licence files are read from
      # where cargo and npm put them.
      - run: cargo fetch --locked
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: node contrib/notices/generate.mjs --check
